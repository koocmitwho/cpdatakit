name: Dependency compatibility matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-probe:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.dependency-set }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
        dependency-set: [lower, latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Test candidate wheel with exact lower or latest dependencies
        run: >-
          python scripts/run_v06_dependency_matrix.py
          --candidate-set ${{ matrix.dependency-set }}
          --output matrix-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.dependency-set }}.json
      - name: Upload dependency probe report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v06-dependency-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.dependency-set }}
          path: matrix-*
