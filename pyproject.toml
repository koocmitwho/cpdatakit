[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cpdatakit"
version = "0.6.1"
description = "Schema-first validation, normalization, and audit tooling for scientific data"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "CPDataKit contributors"}]
keywords = [
  "scientific-data",
  "engineering-data",
  "data-validation",
  "data-quality",
  "schema",
  "hdf5",
  "crystal-plasticity",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "h5py>=3.8,<4",
  "matplotlib>=3.7",
  "pint>=0.22",
  "xarray>=2026.7,<2027",
  "zarr>=3.1,<4",
  "pyarrow>=25,<26",
  "h5netcdf>=1.5,<2",
  "netCDF4>=1.7,<2",
  "fastapi>=0.141,<1",
  "uvicorn>=0.35,<1",
  "Jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pre-commit>=3.5",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "hypothesis>=6.100",
  "httpx>=0.28,<1",
  "ruff>=0.6",
  "twine>=5.1",
]

[project.scripts]
cpdatakit = "cpdatakit.cli:main"

[project.urls]
Homepage = "https://github.com/17636365690/cpdatakit"
Documentation = "https://github.com/17636365690/cpdatakit/blob/main/docs/quickstart.md"
Issues = "https://github.com/17636365690/cpdatakit/issues"
Changelog = "https://github.com/17636365690/cpdatakit/blob/main/CHANGELOG.md"
PyPI = "https://pypi.org/project/cpdatakit/"

[tool.hatch.build]
reproducible = true

[tool.hatch.build.targets.wheel]
packages = ["src/cpdatakit"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/sample_data",
  "/examples",
  "/docs",
  "/assets",
  "/scripts",
  "/.github",
  "/README.md",
  "/README.zh-CN.md",
  "/LICENSE",
  "/NOTICE",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/SECURITY.md",
  "/MAINTAINERS.md",
  "/.editorconfig",
  "/.gitignore",
  "/.pre-commit-config.yaml",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
